<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> Cadastrar Curso - Repositório de TCC </title>
</head>
<body>
    <h1>{% if form.instance.pk %}Editar curso{% else %}Cadastrar curso{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cadastrar</button>
    </form>

    <p><a href="{% url 'listar_cursos' %}"> Voltar à lista de cursos</a></p>
</body>
</html>
