components:
  schemas:
    Aluno:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: integer
        matricula:
          type: string
          maxLength: 50
        curso:
          type: integer
        orientador_atual:
          type: integer
          nullable: true
      required:
      - curso
      - id
      - matricula
      - usuario
    Auditoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ator:
          type: integer
          nullable: true
        acao:
          type: string
          maxLength: 80
        entidade:
          type: string
          maxLength: 80
        registro_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        detalhes: {}
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - acao
      - criado_em
      - entidade
      - id
      - registro_id
    Avaliacao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        membro:
          type: integer
        nota:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        parecer:
          type: string
        recomendacao:
          $ref: '#/components/schemas/RecomendacaoEnum'
        atualizada_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - atualizada_em
      - id
      - membro
      - nota
      - parecer
      - recomendacao
    Banca:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        monografia:
          type: integer
        monografia_titulo:
          type: string
          readOnly: true
        data_hora:
          type: string
          format: date-time
          title: Data e hora da defesa
        fim:
          type: string
          format: date-time
          nullable: true
        local:
          type: string
          title: Local presencial
          maxLength: 250
        link:
          title: Link de videoconferência
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        status:
          allOf:
          - $ref: '#/components/schemas/BancaStatusEnum'
          readOnly: true
        nota_final:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        encerrada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - data_hora
      - encerrada_em
      - id
      - monografia
      - monografia_titulo
      - nota_final
      - status
    BancaStatusEnum:
      enum:
      - em_preparacao
      - agendada
      - realizada
      - cancelada
      type: string
      description: |-
        * `em_preparacao` - Em Preparação
        * `agendada` - Agendada
        * `realizada` - Realizada
        * `cancelada` - Cancelada
    Curso:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
        codigo:
          type: string
          maxLength: 20
        coordenador:
          type: integer
          nullable: true
      required:
      - codigo
      - id
      - nome
    Documento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        monografia:
          type: integer
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        arquivo:
          type: string
          format: uri
          writeOnly: true
        hash_sha256:
          type: string
          readOnly: true
        validado_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        validado_por:
          type: integer
          readOnly: true
          nullable: true
      required:
      - arquivo
      - hash_sha256
      - id
      - monografia
      - tipo
      - validado_em
      - validado_por
    Evento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          type: string
          maxLength: 80
        dados: {}
        criado_em:
          type: string
          format: date-time
          readOnly: true
        processado_em:
          type: string
          format: date-time
          nullable: true
        erro:
          type: string
        tentativas:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - criado_em
      - id
      - tipo
    Membro:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        banca:
          type: integer
        usuario:
          type: integer
          nullable: true
        nome:
          type: string
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            default: ''
            maxLength: 254
          - type: string
            maxLength: 0
        confirmado:
          type: boolean
          readOnly: true
        expira_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revogado:
          type: boolean
          readOnly: true
      required:
      - banca
      - confirmado
      - expira_em
      - id
      - revogado
    Monografia:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 250
        resumo:
          type: string
        palavras_chave:
          type: string
          maxLength: 500
        autor:
          type: integer
          readOnly: true
        orientador:
          type: integer
          nullable: true
        curso:
          type: integer
        arquivo:
          type: string
          format: uri
          nullable: true
          writeOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/MonografiaStatusEnum'
          readOnly: true
        hash_sha256:
          type: string
          readOnly: true
        versao:
          type: integer
          readOnly: true
        submetida_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        aprovado_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        publicada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - aprovado_em
      - autor
      - curso
      - hash_sha256
      - id
      - publicada_em
      - status
      - submetida_em
      - titulo
      - versao
    MonografiaStatusEnum:
      enum:
      - rascunho
      - em_avaliacao
      - aprovada_orientador
      - aprovada
      - ressalvas
      - reprovada
      - publicada
      type: string
      description: |-
        * `rascunho` - Rascunho
        * `em_avaliacao` - Em Avaliação pelo orientador
        * `aprovada_orientador` - Aprovada pelo orientador
        * `aprovada` - Aprovada em defesa
        * `ressalvas` - Aprovada com ressalvas
        * `reprovada` - Reprovada
